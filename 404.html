<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - Halaman Tidak Ditemukan | EbookHub</title>

<meta name="description" content="Maaf, halaman yang Anda cari tidak ditemukan di EbookHub.">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="favicon.ico">

<style>
.error-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:30px;
}

.error-box{
    max-width:600px;
}

.error-box h1{
    font-size:90px;
    color:#2563eb;
    margin-bottom:10px;
}

.error-box h2{
    margin-bottom:15px;
}

.error-box p{
    color:#666;
    margin-bottom:25px;
}

.error-btn{
    display:inline-block;
    background:#2563eb;
    color:#fff;
    padding:14px 28px;
    border-radius:10px;
    font-weight:bold;
    transition:.3s;
}

.error-btn:hover{
    background:#1d4ed8;
}
</style>

<script>
const path = window.location.pathname;

if (path.startsWith("/ebook/")) {

    const slug = path.split("/").pop();

    window.location.replace(
        "/detail.html?slug=" + encodeURIComponent(slug)
    );

}
</script>

</head>

<body>

<div class="error-page">

    <div class="error-box">

        <h1>404</h1>

        <h2>Halaman Tidak Ditemukan</h2>

        <p>
            Maaf, halaman yang Anda cari mungkin telah dipindahkan,
            dihapus, atau URL yang dimasukkan salah.
        </p>

        <a href="index.html" class="error-btn">
            Kembali ke Beranda
        </a>

    </div>

</div>

</body>
</html>
