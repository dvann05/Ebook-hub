<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selamat Datang | EbookHub</title>

    <meta name="description" content="Selamat datang di EbookHub. Temukan ribuan ebook berkualitas untuk belajar dan mengembangkan diri.">

    <link rel="stylesheet" href="assets/css/welcome.css">

</head>

<body>

    <!-- Background -->
    <div class="background">

        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>

    </div>

    <!-- Welcome Card -->
    <main class="welcome">

        <section class="card">

            <img
                src="assets/images/logo/logo.webp"
                class="logo"
                alt="Logo EbookHub">

            <h1>EbookHub</h1>

            <h2>Selamat Datang 👋</h2>

            <p class="subtitle">
                Temukan ribuan ebook berkualitas untuk belajar,
                meningkatkan keterampilan, dan mengembangkan wawasan Anda.
            </p>

            <div class="quote" id="quote">
                "Semakin banyak membaca, semakin luas pengetahuan."
            </div>

            <div class="input-group">

                <label for="username">
                    Siapa nama Anda?
                </label>

                <input
                    type="text"
                    id="username"
                    maxlength="30"
                    autocomplete="off"
                    placeholder="Masukkan nama Anda">

            </div>

            <button id="continueBtn">

                Lanjutkan →

            </button>

            <p class="small">

                Tidak perlu membuat akun.<br>
                Nama Anda hanya disimpan di perangkat ini.

            </p>

        </section>

    </main>

    <script src="assets/js/welcome.js"></script>

</body>

</html>
